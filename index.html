<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SV Ideensammler</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy: #1a365d; --line: #e2e8f0; --muted: #64748b; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
    .card { background: white; padding: 16px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 12px; }
    button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
    .primary { background: var(--navy); color: #fff; border: none; }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>💡 SV Ideensammler</h1></header>
    <main>
      <section id="home">
        <h2>Beliebte Vorschläge</h2>
        <div id="homeList">Lade Vorschläge...</div>
      </section>
    </main>
  </div>

<script>
  const SUPABASE_URL = "https://mownirvgaflngfwzythi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_AL4EwThoIXcaI-5-d7C0Vw_hvDcDsbF";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const liked = () => JSON.parse(localStorage.getItem('sv_liked') || '[]');
  const setLiked = x => localStorage.setItem('sv_liked', JSON.stringify(x));

  async function fetchIdeas() {
    let { data, error } = await db.from('ideas').select('*').order('likes', { ascending: false });
    return data || [];
  }

  function card(i) {
    const l = liked().includes(i.id);
    return `
      <div class="card">
        <h3>${i.title || ''}</h3>
        <p>${i.description || ''}</p>
        <button onclick="toggleLike(${i.id})">${l ? '❤️' : '🤍'} ${i.likes || 0}</button>
      </div>
    `;
  }

  async function render() {
    const ideas = await fetchIdeas();
    const container = document.getElementById('homeList');
    if (container) {
      container.innerHTML = ideas.map(card).join('');
    }
  }

  async function toggleLike(id) {
    const l = liked();
    const isLiked = l.includes(id);
    const delta = isLiked ? -1 : 1;

    // Supabase RPC Aufruf
    const { error } = await db.rpc('increment_idea_likes', { p_id: id, p_delta: delta });

    if (error) {
      alert("Supabase Fehler: " + error.message);
    } else {
      const updated = isLiked ? l.filter(x => x !== id) : [...l, id];
      setLiked(updated);
      render();
    }
  }

  render();
</script>
</body>
</html>
